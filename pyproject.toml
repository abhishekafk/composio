[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "composio-app-research"
version = "0.1.0"
description = "Composio 100-App Research Agent Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "google-genai>=0.1.1",
    "tavily-python>=0.3.3",
    "pandas>=2.2.0",
]

[tool.setuptools.packages.find]
include = ["pipeline*"]

